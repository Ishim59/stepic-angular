<div class="container">
  <h1>{{ title }}</h1>

  <button (click)="toggleVisibility()">
    {{ isVisible ? 'Скрыть' : 'Показать' }} Список
  </button>

  @if(isVisible){
    <ul>
      @for(item of items; track item){
        <li>{{ item }}</li>
      }
    </ul>
  }

  <input [(ngModel)]="newItem" placeholder="Новый элемент">
  <button (click)="addItem()">Добавить</button>
</div>
