<div class="container">
  <h1>Пример шаблонной формы</h1>
  <div>
  <form #myForm='ngForm' (ngSubmit)="onSubmit(myForm)">
    <input type="text" name="firstField" placeholder="Введите имя!" ngModel required>
    <input type="email" name="email" placeholder="Введите email" ngModel required>
    <button type="submit">Показать введенные значения</button>
  </form>
  </div>
</div>
