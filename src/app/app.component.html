<div class="container">
  <h1>Демонстрация кастомного pipe в Angular</h1>

  <input class="textInput" [(ngModel)]="text">

  <div class="card">
    <h2>Case Reverse</h2>
    <p>
      Исходный текст: <strong>{{ text }}</strong>
    </p>
    <p>UpperCase: <strong>{{ text | reverse }}</strong></p>
  </div>

</div>
