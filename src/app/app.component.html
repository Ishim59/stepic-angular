<div class="container">
  <h1>Для увеличения круга, введите число</h1>
  <div>
  <input
    type="number"
    [formControl]="numberControl"
    placeholder="Введите число"
  />
  <button (click)="resetCircle()">Reset</button>
  </div>
  <!-- Анимированный круг с динамическим размером -->
  <div
    class="circle"
    [style.width]="(size$ | async) + 'px'"
    [style.height]="(size$ | async) + 'px'"
  >
  </div>
</div>
