<div class="container">
  <h1>Демонстрация работы if/*ngIf</h1>

  <div>
    @if(isVisibleContentNewDirective){
      <h3>Контент стал доступен в директиве с современным написанием</h3>
    }
    <button (click)="changeIsVisibleContentNewDirective()">Изменить состояние переменной isVisibleContentNewDirective</button>
  </div>

  <div>
    <ng-container *ngIf="isVisibleContentOldDirective">
      <h3>Контент стал видимым в директиве с устаревшим написанием</h3>
    </ng-container>
    <button (click)="changeIsVisibleContentOldDirective()">Изменить состояние переменной isVisibleContentOldDirective</button>
  </div>
</div>
