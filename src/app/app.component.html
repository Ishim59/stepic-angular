<div class="container">
  <h1>Демонстрация работы [ngStyle]</h1>
  <div>
    <button (click)="changeActive()">
      @if(!isActive){
        Включить
      }@else{
        Выключить
      }</button>
  </div>

<div [ngStyle]="{'color': isActive ? 'green' : 'red'}">
  Этот текст меняет цвет в зависимости от переменной isActive.
</div>
</div>
